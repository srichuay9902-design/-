<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Model Viewer</title>
  <script type="module" src="https://unpkg.com"></script>
  <style>
    body { margin: 0; background-color: #f5f5f5; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; }
    .ar-btn {
      background-color: #007bff; color: white; border: none; border-radius: 25px;
      padding: 12px 24px; font-size: 16px; font-weight: bold;
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <model-viewer src="model.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate shadow-intensity="1">
    <button slot="ar-button" class="ar-btn">เปิดดูโมเดลแบบ AR</button>
  </model-viewer>
</body>
</html>
